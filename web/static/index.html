<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok LIVE Horse Racing - OBS Display</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div id="viewport">
    <!-- Camada de Renderização 3D Three.js -->
    <div id="canvas-container"></div>

    <!-- Camada de Transmissão Esportiva / HUD 9:16 -->
    <div id="hud-overlay">
      <!-- 1. Top Bar de Transmissão -->
      <div class="top-broadcast-bar">
        <div class="race-badge" id="raceBadge">
          <span class="trophy">🏇</span>
          <div class="race-badge-text">
            <span class="label">CORRIDA</span>
            <span class="title" id="hudRaceNumber">#1</span>
          </div>
          <span class="weather-chip" id="hudWeather" style="display: none;">☀️ SOL</span>
        </div>

        <div class="status-pill" id="hudStatePill">
          <span class="pulse-dot"></span>
          <span id="hudStateText">AO VIVO</span>
        </div>

        <div style="display: flex; align-items: center; gap: 14px;">
          <div class="timer-box" id="hudTimerBox">
            <span class="num" id="hudTimer">30</span>
            <span class="unit" id="hudTimerUnit">s</span>
          </div>
          <button class="audio-toggle-btn" id="audioToggleBtn" title="Ativar/Desativar Som">🔊</button>
        </div>
      </div>

      <!-- 2. Régua de Progresso da Pista (Track Progress) -->
      <div class="track-progress-container" id="trackProgressContainer" style="display: none;">
        <div class="track-progress-bar" id="trackProgressBar"></div>
        <div class="track-finish-flag">🏁</div>
      </div>

      <!-- 3. Torre Lateral Esquerda de Classificação (Estilo F1 / TV - Não tampa a tela!) -->
      <div class="live-leaderboard-tower" id="hudLeaderboard" style="display: none;"></div>

      <!-- 4. Fila de Notificações / Toasts (Canto Superior Direito) -->
      <div id="notification-container"></div>

      <!-- 5. Centro / Modais: Cartela de Votação, Contagem, Pódio, XP -->
      <div id="center-modal"></div>
    </div>
  </div>

  <!-- Scripts Three.js local e componentes da transmissão -->
  <script src="/static/js/three.min.js"></script>
  <script src="/static/js/scene.js"></script>
  <script src="/static/js/particles.js"></script>
  <!-- Modelos de Corpos 3D Modulares Customizáveis -->
  <script src="/static/js/bodies/body_helpers.js"></script>
  <script src="/static/js/bodies/classic_body.js"></script>
  <script src="/static/js/bodies/armored_body.js"></script>
  <script src="/static/js/bodies/pegasus_body.js"></script>
  <script src="/static/js/bodies/cyber_body.js"></script>
  <script src="/static/js/bodies/heavy_tank_body.js"></script>
  <script src="/static/js/bodies/unicorn_body.js"></script>
  <script src="/static/js/bodies/spectral_body.js"></script>
  <script src="/static/js/bodies/slender_racer_body.js"></script>
  <script src="/static/js/horses_view.js"></script>
  <script src="/static/js/camera.js"></script>
  <script src="/static/js/audio.js"></script>
  <script src="/static/js/hud.js"></script>
  <script src="/static/js/client.js"></script>
</body>
</html>
